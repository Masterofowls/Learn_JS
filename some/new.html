<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password</title>
</head>
<style>
    button {
        width: 60px;
        height: 44px;
        margin: 10px;
        border-radius: 30%;
        background-color: #00bcd4;  
        border: none;
        cursor: pointer;
        
        &:hover {
            background-color: #0097a7;
            transform: scale(1.05);
            transition: all 0.2s ease;
        }
        
        &:active {
            transform: scale(0.95);
        }
        
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

</style>
<body>
    <main>
        <form>
            <label id="pass">
                <input type='password' id="passwordInput">
            </label>
            <button type='submit' onclick="Submit(event)">Submit</button> <!--event = prevent default-->
        </form>
    </main>
    </body>
    <script>
        function Submit(event) {
            event.preventDefault();
            const password = document.getElementById('passwordInput');
            const value = password.value;
            const chars = value.split(''); 
            
            const hasLowercase = chars.filter(char => char >= 'a' && char <= 'z').length > 0;
            const hasUppercase = chars.filter(char => char >= 'A' && char <= 'Z').length > 0;
            const hasDigit = chars.filter(char => char >= '0' && char <= '9').length > 0;
            const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};:'",.<>?\/~`]/.test(value);
            
            if (value.length < 6) {
                alert('Too short - minimum 6 characters');
            } else if (!hasLowercase) {
                alert('Password must contain at least one lowercase letter');
            } else if (!hasUppercase) {
                alert('Password must contain at least one uppercase letter');
            } else if (!hasDigit) {
                alert('Password must contain at least one digit');
            } else if (!hasSpecial) {
                alert('Password must contain at least one special character (!@#$%^&* etc.)');
            } else {
                alert('Password is valid!');
            }
        }
    </script>
</html>
